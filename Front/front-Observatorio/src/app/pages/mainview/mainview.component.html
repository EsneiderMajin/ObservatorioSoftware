<img src="assets/imagenbase.jpg" alt="Observatorio de Calidad de Software" class="banner-image" />
<h1>Observatorio Software</h1>
<div *ngIf="!mostrarResultados">
  <p>Por favor de clic en el botón para iniciar la encuesta</p>
</div>


<div class="encuesta-container" *ngIf="!mostrarResultados">
    <button mat-button class="survey-button" routerLink="/cuestionario">
    Iniciar Encuesta
  </button>
</div>

<div class="encuesta-container" *ngIf="mostrarResultados">
    <button mat-button class="survey-button" routerLink="/resultados">
    Mostrar Resultados
  </button>
</div>
