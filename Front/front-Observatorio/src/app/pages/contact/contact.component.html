<div class="contact-container">
    <img src="assets/imagenbase.png" alt="Banner Contacto" class="header-image">
    
    <h2>Inicia una conversación con nosotros</h2>
    
    <div class="light">

      <form [formGroup]="contactForm" (ngSubmit)="submitForm()">
        <mat-form-field appearance="outline" class="full-width light">
          <mat-label class="light">Nombre</mat-label>
          <input matInput formControlName="name" required>
        </mat-form-field>
  
        <div class="row">
          <mat-form-field appearance="outline" class="half-width light">
            <mat-label>Correo</mat-label>
            <input matInput type="email" formControlName="email" required>
          </mat-form-field>
  
          <mat-form-field appearance="outline" class="half-width light">
            <mat-label>Teléfono</mat-label>
            <input matInput type="tel" formControlName="phone">
          </mat-form-field>
        </div>
  
        <mat-form-field appearance="outline" class="full-width light">
          <mat-label>Mensaje</mat-label>
          <textarea matInput rows="3" formControlName="message"></textarea>
        </mat-form-field>
  
        <button mat-raised-button color="primary" type="submit">Enviar</button>
      </form>
    </div>
  </div>
