<div class="modal-overlay">
  <div class="modal-content">
    <h2
      [ngClass]="{
        'error-title': nofiticationData.isError,
        'success-title': !nofiticationData.isError
      }"
    >
      {{ nofiticationData.title }}
    </h2>
    <p class="modal-description">{{ nofiticationData.description }}</p>
    <div class="modal-actions">
      <button class="btn-ok" (click)="onButtonClick('aceptar')">Aceptar</button>
    </div>
  </div>
</div>
